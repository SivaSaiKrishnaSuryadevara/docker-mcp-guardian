name: PR title

# pull_request_target so titles on fork PRs are checked too. Safe here: the
# job never checks out or runs code from the PR, it only reads the title.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            feat
            fix
            sec
            docs
            ci
            test
            refactor
            perf
            style
            chore
