name: Release signed image

# Builds the multi-arch image, pushes it to GHCR, signs it with keyless Sigstore cosign
# (GitHub OIDC, recorded in the Rekor transparency log) and attaches a GitHub build
# provenance attestation. Everything is bound to the image's immutable digest.

on:
  push:
    tags: ["v*.*.*"]
  # Manual runs publish a `sha-<short>` tag only, never a version tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
      id-token: write # OIDC token for keyless cosign signing and the attestation
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry paths must be lowercase; the repository owner is not.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docker-mcp-guardian" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=docker-mcp-guardian
            org.opencontainers.image.description=Read-only-by-default Docker MCP server over stdio

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # Keyless: cosign gets a short-lived certificate from Fulcio for this workflow's OIDC
      # identity, signs the multi-arch index by digest, and uploads the signature to Rekor.
      # No private key is stored anywhere. Values go through env, not ${{ }} in the script.
      - name: Sign image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Fail the release if the signature can't be verified with the same policy users will use.
      - name: Verify signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${IDENTITY}" > /dev/null
          echo "Signed and verified: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
